<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141413">
  <meta name="description" content="Android 화면 녹화 앱, Static Screen Recorder.">
  <link rel="canonical" href="https://zistered.github.io/">
  <title>Zistered — Static Screen Recorder</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: #141413;
      color: #eeede8;
      line-height: 1.8;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    * { box-sizing: border-box; }
    body {
      width: min(680px, calc(100% - 48px));
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #d6b66c; outline-offset: 6px; }
    header { padding: 32px 0; }
    .name { font-size: 17px; font-weight: 650; letter-spacing: -.4px; }
    main { display: flex; align-items: center; padding: 56px 0 96px; }
    h1 { margin: 0 0 22px; font-size: clamp(30px, 5vw, 42px); font-weight: 650; line-height: 1.3; letter-spacing: -1.4px; }
    .description { max-width: 440px; margin: 0; color: #bdbbb2; font-size: 16px; }
    .status { margin: 22px 0 0; color: #a6a398; font-size: 13px; }
    footer { padding: 24px 0; border-top: 1px solid #ffffff1a; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 14px; }
    .links a { display: inline-flex; align-items: center; min-height: 44px; color: #d6b66c; font-size: 13px; }
    .copyright { margin: 0; font-size: 12px; color: #a6a398; }
    @media (max-width: 480px) {
      header { padding-top: 24px; }
      main { padding: 40px 0 72px; }
      .description { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header><a class="name" href="https://zistered.github.io/" aria-label="홈">Zistered</a></header>
  <main>
    <section aria-labelledby="app-name">
      <h1 id="app-name">Static Screen Recorder</h1>
      <p class="description">다른 앱의 화면과 소리를 60fps MP4 영상으로 기록하는 Android 앱입니다.</p>
      <p class="status">현재 비공개 베타 테스트 중입니다.</p>
    </section>
  </main>
  <footer>
    <nav class="links" aria-label="안내 및 문의">
      <a href="https://zistered.github.io/static-screen-recorder-privacy/">개인정보처리방침</a>
      <a href="mailto:zistered@gmail.com">zistered@gmail.com</a>
    </nav>
    <p class="copyright">© Zistered</p>
  </footer>
</body>
</html>
